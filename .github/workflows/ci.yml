name: Local checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install pinned build tools
        run: npm ci --ignore-scripts
      - name: Build and check types
        run: |
          npm run build
          npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Host controller tests
        run: python3 -m unittest discover -s minimal/test -p '*_test.py'
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows with synthetic CLI
        run: npm run test:e2e
      - name: Verify standalone release
        run: |
          npm run package
          npm run verify:release
      - name: Packaged Compose lifecycle with host fake CLI
        run: npm run test:compose
